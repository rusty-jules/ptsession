[package]
name = "ptarchive"
version = "0.1.0"
authors = ["Julian Aichholz <julianaichholz@gmail.com>"]
edition = "2018"

[dependencies]
async-compression = { version = "0.4.22", features = ["gzip", "tokio", "xz", "zstd"] }
bwavfile = "2.0.1"
chrono = { version = "0.4.40", features = ["serde"] }
clap = { version = "4.5.34", features = ["derive"] }
env_logger = { version = "*" }
futures-util = "0.3.31"
ignore = "0.4.23"
indicatif = { version = "0.17.11", features = ["tokio"] }
log = "0.4"
maplit = "1.0.2"
oci-client = { git = "https://github.com/oras-project/rust-oci-client", rev = "v0.14.0" }
ptsession = { path = "../ptsession" }
reqwest = "0.12.15"
serde = { version = "*", default-features = false, features = ["derive"] }
serde_json = { version = "*" }
sha2 = "0.10.8"
tempfile = "3.19.1"
tokio = { version = "1.44.1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.14", features = ["compat", "futures-util", "io", "io-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.172"

[target.'cfg(target_os = "macos")'.dependencies]
CoreFoundation-sys = "0.1.4"
IOKit-sys = "0.1.5"

