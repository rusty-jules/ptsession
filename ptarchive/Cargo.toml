[package]
name = "ptarchive"
version = "0.1.0"
authors = ["Julian Aichholz <julianaichholz@gmail.com>"]
edition = "2018"

[dependencies]
async-compression = { version = "0.4.22", features = ["gzip", "tokio", "xz", "zstd"] }
bwavfile = "2.0.1"
chrono = { version = "0.4.40", features = ["serde"] }
clap = { version = "4.5.34", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml"] }
futures-util = "0.3.31"
ignore = "0.4.23"
indicatif = { version = "0.17.11", features = ["tokio"] }
json-subscriber = "0.2.4"
maplit = "1.0.2"
metrics = "0.21.1"
metrics-exporter-influx = { version = "0.2.2", features = ["http"] }
metrics-tracing-context = "0.14.0"
metrics-util = "0.15.1"
oci-client = { git = "https://github.com/oras-project/rust-oci-client", rev = "v0.14.0" }
ptsession = { path = "../ptsession" }
r2d2 = "0.8"
r2d2_sqlite = { version = "0.27.0", features = ["bundled"] }
reqwest = "0.12.15"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "*", default-features = false, features = ["derive"] }
serde_json = { version = "*" }
sha2 = "0.10.8"
shellexpand = "3.1.1"
tempfile = "3.19.1"
tokio = { version = "1.44.1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.14", features = ["compat", "futures-util", "io", "io-util"] }
tracing = "0.1.41"
tracing-indicatif = "0.3.9"
tracing-subscriber = { version = "0.3.19", features = ["fmt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.172"

[target.'cfg(target_os = "macos")'.dependencies]
CoreFoundation-sys = "0.1.4"
IOKit-sys = "0.1.5"

